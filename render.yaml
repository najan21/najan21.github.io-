services:
  - type: web
    name: the-vault-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn vault_webapp:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: VAULT_DB_PATH
        value: /data/vault.db
    disk:
      name: vault-data
      mountPath: /data
      sizeGB: 1
